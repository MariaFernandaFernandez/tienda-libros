<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Virtual de Libros</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>Tienda Virtual de Libros</h1>
    <input type="text" id="busqueda" placeholder="Buscar libros...">
    <nav>
      <a href="login.html">Iniciar Sesión</a>
      <a href="#" id="ver-carrito">🛒 Ver Carrito</a>
    </nav>
    <p id="bienvenida"></p>
<button id="cerrarSesion" style="display:none;">Cerrar sesión</button>

  </header>

  <main id="catalogo"></main>

  <section id="carrito" class="oculto">
    <h2>Carrito de Compras</h2>
    <ul id="items-carrito"></ul>
    <p>Total: $<span id="total">0</span></p>
    <button onclick="cerrarCarrito()">Cerrar</button>
  </section>

  <script src="js/app.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
